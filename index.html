<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>StableNet Training Feedback & Certification</title>
    <meta name="description" content="Training feedback submission, automated dual-variant certificate generation with verification codes, and analytics dashboard for MTN." />
    <meta property="og:title" content="StableNet Training Feedback & Certification" />
    <meta property="og:description" content="Training feedback submission, automated dual-variant certificate generation with verification codes, and analytics dashboard for MTN." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint (no light flash in dark mode).
      (function () {
        try {
          var mode = JSON.parse(localStorage.getItem('stablenet-theme') || '"system"')
          var dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
